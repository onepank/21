<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Гра «21» — Gothic Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;900&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="parallax-scene">
    <div class="bg-layer bg-vignette" data-speed="0.01"></div>
    <div class="bg-layer bg-ornament" data-speed="0.03"></div>
    <div class="bg-layer bg-grain" data-speed="0.005"></div>
    
    <div class="parallax-orb orb-1" data-speed="0.05"></div>
    <div class="parallax-orb orb-2" data-speed="0.08"></div>
    <div class="parallax-orb orb-3" data-speed="0.04"></div>
    <div class="parallax-rune rune-1" data-speed="0.06">✦</div>
    <div class="parallax-rune rune-2" data-speed="0.09">✧</div>
    <div class="parallax-rune rune-3" data-speed="0.07">✦</div>
  </div>

  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>

  <main class="game-wrapper">

    <header class="game-header">
      <div class="header-ornament">
        <span class="orn-line"></span>
        <span class="orn-diamond"></span>
        <span class="orn-line"></span>
      </div>
      <h1 class="title">
        <span class="title-main">ГРА</span>
        <span class="title-number">21</span>
      </h1>
      <p class="subtitle">Випробуй удачу проти комп'ютера</p>
      <div class="header-ornament">
        <span class="orn-line"></span>
        <span class="orn-diamond"></span>
        <span class="orn-line"></span>
      </div>
    </header>

    <section class="players">

      <div class="player-card player-card--user" id="userPanel">
        <div class="card-frame"></div>
        <div class="player-card-glow"></div>
        <div class="player-badge">ГРАВЕЦЬ</div>
        <h2 class="player-name" id="userName">Гравець</h2>
        <div class="cards-row" id="userCards"></div>
        <div class="score-box">
          <span class="score-label">Сума очок</span>
          <span class="score-value" id="userScore">0</span>
        </div>
      </div>

      <div class="vs-divider">
        <div class="vs-line"></div>
        <span class="vs-text">VS</span>
        <div class="vs-line"></div>
      </div>

      <div class="player-card player-card--bot" id="botPanel">
        <div class="card-frame"></div>
        <div class="player-card-glow"></div>
        <div class="player-badge">КОМП'ЮТЕР</div>
        <h2 class="player-name">AI Dealer</h2>
        <div class="cards-row" id="botCards"></div>
        <div class="score-box">
          <span class="score-label">Сума очок</span>
          <span class="score-value" id="botScore">0</span>
        </div>
      </div>

    </section>

    <div class="status-bar" id="statusBar">
      <div class="status-dot"></div>
      <span class="status-text" id="statusText">Обери складність та почни гру</span>
    </div>

    <div class="controls-wrapper">
      
      <div class="difficulty-selector">
        <span class="diff-label">Складність:</span>
        <div class="diff-options">
          <button class="diff-btn active" data-diff="easy">Легка</button>
          <button class="diff-btn" data-diff="medium">Середня</button>
          <button class="diff-btn" data-diff="hard">Складна</button>
          <div class="diff-indicator" id="diffIndicator"></div>
        </div>
      </div>

      <div class="controls">
        <button class="btn btn-primary" id="startBtn">
          <span class="btn-text">Почати гру</span>
          <span class="btn-shine"></span>
        </button>
        <button class="btn btn-accent hidden" id="drawBtn">
          <span class="btn-text">Взяти карту</span>
          <span class="btn-shine"></span>
        </button>
      </div>

    </div>

  </main>

  <div class="modal-overlay" id="modal">
    <div class="modal">
      <div class="modal-glow"></div>
      <div class="modal-ornament">
        <span class="orn-line"></span>
        <span class="orn-diamond"></span>
        <span class="orn-line"></span>
      </div>
      <div class="modal-emoji" id="modalEmoji">🏆</div>
      <h2 class="modal-title" id="modalTitle">Перемога</h2>
      <p class="modal-subtitle" id="modalSubtitle">Ти переміг комп'ютер</p>
      <div class="modal-scores">
        <div class="modal-score">
          <span class="modal-score-label">Ти</span>
          <span class="modal-score-value" id="modalUser">0</span>
        </div>
        <div class="modal-score-divider"></div>
        <div class="modal-score">
          <span class="modal-score-label">Бот</span>
          <span class="modal-score-value" id="modalBot">0</span>
        </div>
      </div>
      <button class="btn btn-primary" id="playAgainBtn">
        <span class="btn-text">Грати ще</span>
        <span class="btn-shine"></span>
      </button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
